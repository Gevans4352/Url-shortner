name: Url Shortner
on:
  push:
    branches: [ "main" ] 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Deploy to Server
        run: |
          echo "Ready to deploy URL Shortener"
          echo "Database: SQLite (urls.db)"
          echo "Port: 5000"